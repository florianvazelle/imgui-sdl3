[package]
name = "imgui-sdl3"
version = "0.6.0"
authors = ["florianvazelle"]
edition = "2024"
description = "Integration of ImGui with SDL3"
license = "MIT"
repository = "https://github.com/florianvazelle/imgui-sdl3"
keywords = ["imgui", "sdl3", "gui", "renderer"]
categories = ["gui", "rendering", "graphics"]
readme = "README.md"

[dependencies]
imgui = "0.12"
sdl3 = "0.22"

[features]
# Transpile shaders to MSL. Always on when building on macOS; enable it to cross-compile for macOS.
metal = ["dep:spirv-cross2"]

[build-dependencies]
shaderc = "0.10.1"
spirv-cross2 = { version = "0.7.2", features = ["msl"], optional = true }

# Target-specific build-dependencies are matched against the host, like `cfg` inside build.rs.
[target.'cfg(target_os = "macos")'.build-dependencies]
spirv-cross2 = { version = "0.7.2", features = ["msl"] }

# docs.rs builds the Apple targets from a Linux host, so it needs the MSL transpiler.
[package.metadata.docs.rs]
features = ["metal"]

[dev-dependencies]
image = "0.25.10"
